<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправить NFT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: linear-gradient(135deg, #1f1f1f, #0a0a0a);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 320px;
            border: 1px solid #333;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #2ea6ff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:active {
            background-color: #1c7acb;
        }
        .gift-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gift-icon">🎁</div>
        <h1>Отправка NFT</h1>
        <p>Нажмите кнопку ниже, чтобы перейти к передаче подарка.</p>
        <button class="btn" id="sendBtn">Отправить подарок</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        document.getElementById('sendBtn').addEventListener('click', function() {
            // Открываем диалог отправки подарка в Telegram
            // Ссылка на твой профиль (замени oqraft, если нужно)
            tg.openTelegramLink("https://t.me/oqraft");
            
            // Закрываем Mini App после перехода
            setTimeout(() => {
                tg.close();
            }, 1000);
        });
    </script>
</body>
</html>
